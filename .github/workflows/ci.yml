name: CI

# ADR-0017 makes this a *gate*, not a status report: `./gradlew build` runs `commonTest` +
# `server` integration tests, ktlint and detekt, and a failure in any of them fails the job.
#
# ADR-0017's 2026-08-28 amendment: for solo development, a formal GitHub branch-protection rule
# (Settings -> Branches -> "Require status checks to pass before merging") is optional ceremony,
# not required — check the Actions tab is green before merging locally instead. Revisit if a
# second developer ever joins.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-and-server:
    name: core + server (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17 per ADR-0019. The corporate-proxy `cacerts` workaround in docs/TOOLING.md is
      # deliberately local-only — GitHub's runners are on the public internet and need none of it.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` = compile + ktlintCheck + detekt + test, for both `core` and `server` — both lint
      # tools hang off `check`, so there is no separate step to keep in sync with this one.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: |
            core/build/reports/tests/
            server/build/reports/tests/
            core/build/test-results/
            server/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: web (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` (not `npm install`) — it fails outright if package-lock.json and package.json
      # disagree, which is how ADR-0017's version pinning is enforced rather than just stated.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # `next build` type-checks the whole app, so this is the compile gate too.
      - name: Build
        run: npm run build
